<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
    <linearGradient id="wg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#818cf8"/>
      <stop offset="45%"  stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Puzzle piece shape (фон в форме пазла) -->
  <path d="
    M 4,4
    L 12,4 C 12,4 12,0 16,0 C 20,0 20,4 20,4
    L 28,4 Q 30,4 30,6
    L 30,12 C 30,12 32,12 32,16 C 32,20 30,20 30,20
    L 30,26 Q 30,28 28,28
    L 20,28 C 20,28 20,32 16,32 C 12,32 12,28 12,28
    L 4,28 Q 2,28 2,26
    L 2,6 Q 2,4 4,4 Z
  " fill="url(#bg)"/>

  <!-- W из нод -->
  <g filter="url(#glow)">
    <polyline points="5,9 9,21 16,13 23,21 27,11"
              stroke="url(#wg)" stroke-width="2" fill="none"
              stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="5"  cy="9"  r="2.2" fill="#818cf8"/>
    <circle cx="9"  cy="21" r="2.2" fill="#9d7afe"/>
    <circle cx="16" cy="13" r="2.4" fill="#c084fc"/>
    <circle cx="23" cy="21" r="2.2" fill="#9dd8fa"/>
    <circle cx="27" cy="11" r="2.2" fill="#22d3ee"/>
  </g>
</svg>
