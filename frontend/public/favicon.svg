<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
    <linearGradient id="wg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#818cf8"/>
      <stop offset="45%"  stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <g filter="url(#glow)">
    <!-- W from nodes: left tip higher than right -->
    <polyline points="4,8 9,22 16,13 23,22 28,11"
              stroke="url(#wg)" stroke-width="2" fill="none"
              stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="4"  cy="8"  r="2.3" fill="#818cf8"/>
    <circle cx="9"  cy="22" r="2.3" fill="#9d7afe"/>
    <circle cx="16" cy="13" r="2.6" fill="#c084fc"/>
    <circle cx="23" cy="22" r="2.3" fill="#9dd8fa"/>
    <circle cx="28" cy="11" r="2.3" fill="#22d3ee"/>
  </g>
</svg>
