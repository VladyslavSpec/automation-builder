<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
    <linearGradient id="wg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#818cf8"/>
      <stop offset="45%"  stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!--
    Пазл: асимметричный, разные размеры, разное расположение
    Верх:   маленький усик (tab) — смещён влево
    Право:  дырка (slot/notch) — смещена выше центра, большая
    Низ:    усик (tab) — смещён вправо, другой размер
    Лево:   ровный (без выступа)
  -->
  <path d="
    M 2,4
    L 6,4 C 6,4 6,0 8.5,0 C 11,0 11,4 11,4
    L 28,4 Q 30,4 30,6
    L 30,9 C 30,9 26,9 26,13.5 C 26,18 30,18 30,18
    L 30,28 Q 30,30 28,30
    L 22,30 C 22,30 22,32 19,32 C 16,32 16,30 16,30
    L 4,30 Q 2,30 2,28
    L 2,4 Z
  " fill="url(#bg)"/>

  <!-- W из нод -->
  <g filter="url(#glow)">
    <polyline points="5,9 9,21 16,13 23,21 27,11"
              stroke="url(#wg)" stroke-width="2" fill="none"
              stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="5"  cy="9"  r="2.2" fill="#818cf8"/>
    <circle cx="9"  cy="21" r="2.2" fill="#9d7afe"/>
    <circle cx="16" cy="13" r="2.4" fill="#c084fc"/>
    <circle cx="23" cy="21" r="2.2" fill="#9dd8fa"/>
    <circle cx="27" cy="11" r="2.2" fill="#22d3ee"/>
  </g>
</svg>
