<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Weavo</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #07070f; color: #e2e8f0;
      font-family: Inter, system-ui, sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 24px;
    }
    .card {
      background: #0c0c18; border: 1px solid rgba(255,255,255,0.07);
      border-radius: 18px; padding: 36px 32px 32px;
      width: 100%; max-width: 400px;
      box-shadow: 0 32px 80px rgba(0,0,0,0.5);
      position: relative;
    }
    .top-glow {
      position: absolute; top: 0; left: 10%; right: 10%; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(99,102,241,0.5), transparent);
    }
    .logo {
      display: flex; align-items: center; justify-content: center;
      gap: 8px; margin-bottom: 24px;
    }
    .logo-text {
      font-size: 15px; font-weight: 800;
      background: linear-gradient(135deg, #818cf8, #c084fc, #22d3ee);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    h1 { font-size: 18px; font-weight: 700; color: #f1f5f9; text-align: center; margin-bottom: 6px; }
    .sub { font-size: 12px; color: #475569; text-align: center; margin-bottom: 24px; }
    label { font-size: 10px; color: #475569; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; display: block; margin-bottom: 5px; }
    input {
      width: 100%; background: #080810; border: 1px solid rgba(255,255,255,0.08);
      border-radius: 7px; padding: 10px 13px; font-size: 13px; color: #e2e8f0;
      outline: none; font-family: inherit; margin-bottom: 14px; transition: border-color 0.15s;
    }
    input:focus { border-color: rgba(99,102,241,0.55); box-shadow: 0 0 0 3px rgba(99,102,241,0.1); }
    .btn {
      width: 100%; padding: 11px; font-size: 13px; font-weight: 600;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white; border: none; border-radius: 8px; cursor: pointer;
      font-family: inherit; transition: opacity 0.15s; margin-top: 4px;
    }
    .btn:hover { opacity: 0.88; }
    .btn:disabled { opacity: 0.5; cursor: default; }
    .error { font-size: 12px; color: #f87171; background: #f8717115; border: 1px solid #f8717130; border-radius: 6px; padding: 8px 12px; margin-bottom: 12px; }
    .success { font-size: 13px; color: #4ade80; text-align: center; padding: 16px 0; }
    .back { display: block; text-align: center; font-size: 12px; color: #475569; margin-top: 16px; text-decoration: none; }
    .back:hover { color: #94a3b8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="top-glow"></div>
    <div class="logo">
      <svg width="28" height="28" viewBox="0 0 32 32" fill="none"
           style="filter: drop-shadow(0 0 4px rgba(99,102,241,0.6))">
        <defs>
          <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#6366f1"/>
            <stop offset="100%" stop-color="#7c3aed"/>
          </linearGradient>
        </defs>
        <rect width="32" height="32" rx="7" fill="url(#g)"/>
        <rect x="9" y="9" width="14" height="14" rx="3" fill="rgba(255,255,255,0.18)" stroke="white" stroke-width="2"/>
        <line x1="3" y1="12" x2="9" y2="12" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
        <line x1="3" y1="16" x2="9" y2="16" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
        <line x1="3" y1="20" x2="9" y2="20" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
        <circle cx="3" cy="12" r="1.4" fill="white" opacity="0.8"/>
        <circle cx="3" cy="16" r="1.4" fill="white" opacity="0.8"/>
        <circle cx="3" cy="20" r="1.4" fill="white" opacity="0.8"/>
        <line x1="23" y1="16" x2="27" y2="16" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M25 13 L29 16 L25 19" stroke="white" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="logo-text">Weavo</span>
    </div>

    <h1>Set new password</h1>
    <p class="sub">Enter your new password below</p>

    <div id="form-area">
      <div id="error" class="error" style="display:none"></div>
      <label>NEW PASSWORD</label>
      <input type="password" id="pw" placeholder="Min. 8 characters" autocomplete="new-password"/>
      <label>CONFIRM PASSWORD</label>
      <input type="password" id="pw2" placeholder="Repeat password" autocomplete="new-password"/>
      <button class="btn" id="btn" onclick="submit()">Set New Password</button>
      <a class="back" href="/">← Back to Weavo</a>
    </div>
    <div id="success-area" style="display:none">
      <div class="success">✓ Password updated successfully!</div>
      <p style="font-size:12px;color:#475569;text-align:center;margin-top:8px">Redirecting in <span id="n">3</span>s...</p>
    </div>
  </div>

  <script>
    const token = new URLSearchParams(window.location.search).get('token');
    if (!token) {
      document.getElementById('error').textContent = 'Invalid reset link. Please request a new one.';
      document.getElementById('error').style.display = 'block';
      document.getElementById('btn').disabled = true;
    }

    async function submit() {
      const pw = document.getElementById('pw').value;
      const pw2 = document.getElementById('pw2').value;
      const errEl = document.getElementById('error');
      errEl.style.display = 'none';

      if (pw.length < 8) { errEl.textContent = 'Password must be at least 8 characters.'; errEl.style.display = 'block'; return; }
      if (pw !== pw2) { errEl.textContent = 'Passwords do not match.'; errEl.style.display = 'block'; return; }

      document.getElementById('btn').disabled = true;
      document.getElementById('btn').textContent = 'Updating...';

      try {
        const res = await fetch('/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, new_password: pw }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Something went wrong');

        document.getElementById('form-area').style.display = 'none';
        document.getElementById('success-area').style.display = 'block';
        let t = 3;
        const n = document.getElementById('n');
        setInterval(() => { t--; n.textContent = t; if (t <= 0) window.location.href = '/'; }, 1000);
      } catch (e) {
        errEl.textContent = e.message;
        errEl.style.display = 'block';
        document.getElementById('btn').disabled = false;
        document.getElementById('btn').textContent = 'Set New Password';
      }
    }
  </script>
</body>
</html>
