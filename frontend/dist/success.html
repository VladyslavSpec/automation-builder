<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Successful — Weavo</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0b0b1c; color: #e2e8f0;
      font-family: Inter, system-ui, sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #111120; border: 1px solid #ffffff12;
      border-radius: 16px; padding: 48px 40px; text-align: center;
      max-width: 420px; width: 90%;
    }
    .icon {
      width: 64px; height: 64px; border-radius: 50%;
      background: #22c55e18; border: 1px solid #22c55e40;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px; font-size: 28px;
    }
    h1 { font-size: 22px; font-weight: 800; color: #f1f5f9; margin-bottom: 10px; }
    p { font-size: 14px; color: #64748b; line-height: 1.6; margin-bottom: 28px; }
    .btn {
      display: inline-block; padding: 11px 28px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      color: #fff; border-radius: 8px; text-decoration: none;
      font-size: 14px; font-weight: 600; cursor: pointer;
      border: none; transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .countdown { font-size: 12px; color: #334155; margin-top: 16px; }
    .logo {
      display: flex; align-items: center; justify-content: center;
      gap: 8px; margin-bottom: 32px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg width="28" height="20" viewBox="0 0 32 22" fill="none"
           style="filter: drop-shadow(0 0 4px rgba(129,140,248,1)) drop-shadow(0 0 10px rgba(192,132,252,0.7));">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="32" y2="22" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#818cf8"/>
            <stop offset="55%" stop-color="#c084fc"/>
            <stop offset="100%" stop-color="#22d3ee"/>
          </linearGradient>
        </defs>
        <path d="M1 4 Q8.5 0 16 4 Q23.5 8 31 4" stroke="url(#g)" stroke-width="2.3" fill="none" stroke-linecap="round"/>
        <path d="M1 11 Q8.5 7 16 11 Q23.5 15 31 11" stroke="url(#g)" stroke-width="2.3" fill="none" stroke-linecap="round"/>
        <path d="M1 18 Q8.5 14 16 18 Q23.5 22 31 18" stroke="url(#g)" stroke-width="2.3" fill="none" stroke-linecap="round"/>
      </svg>
      <span style="font-size:15px;font-weight:800;background:linear-gradient(135deg,#818cf8,#c084fc,#22d3ee);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">Weavo</span>
    </div>

    <div class="icon">✓</div>
    <h1>Payment Successful!</h1>
    <p>Your plan has been upgraded. It may take a few seconds to reflect in the app.</p>
    <a href="/" class="btn">Back to Weavo</a>
    <div class="countdown" id="cd">Redirecting in <span id="n">5</span>s...</div>
  </div>

  <script>
    let t = 5;
    const n = document.getElementById('n');
    const timer = setInterval(() => {
      t--;
      n.textContent = t;
      if (t <= 0) { clearInterval(timer); window.location.href = '/'; }
    }, 1000);
  </script>
</body>
</html>
