<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Chip body -->
  <rect x="11" y="10" width="10" height="12" rx="2.5"
        fill="rgba(255,255,255,0.15)" stroke="white" stroke-width="1.8"/>
  <!-- Left connectors (3 lines + dots) -->
  <line x1="6" y1="13" x2="11" y2="13" stroke="white" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="6" y1="16" x2="11" y2="16" stroke="white" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="6" y1="19" x2="11" y2="19" stroke="white" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="6" cy="13" r="1.3" fill="white" opacity="0.8"/>
  <circle cx="6" cy="16" r="1.3" fill="white" opacity="0.8"/>
  <circle cx="6" cy="19" r="1.3" fill="white" opacity="0.8"/>
  <!-- Right connector + arrow -->
  <line x1="21" y1="16" x2="24" y2="16" stroke="white" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M23 13.5 L26.5 16 L23 18.5" stroke="white" stroke-width="1.5" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
