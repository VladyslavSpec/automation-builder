<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Node body (the automation block) -->
  <rect x="9.5" y="7" width="12" height="18" rx="2.5"
        fill="rgba(255,255,255,0.13)" stroke="white" stroke-width="1.7"/>

  <!-- Input connectors — 3 lines entering from the left -->
  <line x1="2.5" y1="11.5" x2="9.5" y2="11.5" stroke="white" stroke-width="1.7" stroke-linecap="round"/>
  <line x1="2.5" y1="16"   x2="9.5" y2="16"   stroke="white" stroke-width="1.7" stroke-linecap="round"/>
  <line x1="2.5" y1="20.5" x2="9.5" y2="20.5" stroke="white" stroke-width="1.7" stroke-linecap="round"/>

  <!-- Output connector — line + arrowhead to the right -->
  <line x1="21.5" y1="16" x2="27" y2="16" stroke="white" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M25 13.5 L29 16 L25 18.5"
        fill="none" stroke="white" stroke-width="1.7"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
